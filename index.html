<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小朋友集點卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ui-bg:#F4EFEA; --ui-panel:#FFFFFF; --ui-ink:#4A3B36; --ui-soft:#8A7770; --ui-line:#E3D8D0; --ui-accent:#E88AA5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--ui-bg:#1E1A19; --ui-panel:#2A2423; --ui-ink:#F1E6E0; --ui-soft:#B7A39B; --ui-line:#43393A; --ui-accent:#F2A2B8; color-scheme:dark;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--ui-bg);color:var(--ui-ink);
  font-family:"Huninn","Zen Maru Gothic","PingFang TC","Microsoft JhengHei",sans-serif;}
.layout{display:flex;gap:24px;padding:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap}

/* ---- 控制面板 ---- */
.panel{background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:16px;padding:20px;width:310px;position:sticky;top:24px}
.panel h2{margin:0 0 4px;font-size:22px}
.panel .sub{margin:0 0 14px;font-size:14px;color:var(--ui-soft)}
fieldset{border:0;border-top:1px dashed var(--ui-line);margin:0;padding:14px 0 6px}
legend{font-size:16px;padding-right:8px}
label{display:block;font-size:14px;color:var(--ui-soft);margin:8px 0 4px}
input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ui-ink);background:transparent;
  border:1.5px solid var(--ui-line);border-radius:10px;padding:8px 12px}
input[type=text]:focus{outline:2px solid var(--ui-accent);outline-offset:1px;border-color:transparent}
input:disabled{opacity:.45}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.themes button{background:var(--t-bg);border:2px solid transparent;border-radius:12px;padding:4px 0 2px;cursor:pointer;
  font:inherit;font-size:11px;color:#5A4640;display:flex;flex-direction:column;align-items:center}
.themes button svg{width:38px;height:38px}
.themes button[aria-pressed=true]{border-color:var(--t-c)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ui-ink);margin-top:4px}
.print{width:100%;margin-top:16px;font:inherit;font-size:18px;padding:12px;border:0;border-radius:999px;
  background:var(--ui-accent);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--ui-accent);outline-offset:2px}
.tip{font-size:13px;color:var(--ui-soft);line-height:1.7;margin:10px 0 0}

/* ---- A4 紙 ---- */
.preview{max-width:100%}
.sheet{width:210mm;height:297mm;background:#fff;box-shadow:0 4px 18px rgba(80,50,40,.18);
  padding:7mm 8mm;display:flex;flex-direction:column;justify-content:space-between;position:relative;color:#5A4640;
  font-family:"Huninn","Zen Maru Gothic","PingFang TC","Microsoft JhengHei",sans-serif}
.cut{position:absolute;left:0;right:0;top:50%;border-top:.3mm dashed #CFC4BE}
.cut span{position:absolute;left:50%;transform:translateX(-50%);top:-2.4mm;background:#fff;padding:0 2mm;font-size:7.5pt;color:#B3A49D}

.card{position:relative;height:138mm;border-radius:9mm;padding:5.5mm 7mm 6.5mm;display:flex;flex-direction:column;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.1mm, transparent 1.2mm),radial-gradient(var(--dot) 1.1mm, transparent 1.2mm);
  background-size:9mm 9mm;background-position:0 0,4.5mm 4.5mm;
  border:1.4mm solid var(--c)}
.card::before{content:"";position:absolute;inset:1.8mm;border:.5mm dashed var(--c);border-radius:7.5mm;opacity:.55;pointer-events:none}

.head{display:flex;align-items:center;gap:4mm;height:27mm;margin-bottom:3mm;position:relative;z-index:1}
.mascot{width:25mm;height:25mm;flex:none}
.titlebox{flex:1}
.ribbon{display:inline-flex;align-items:baseline;gap:1.5mm;background:var(--c);color:#fff;border-radius:999px;
  padding:1.8mm 6mm 2.2mm;font-size:19pt;line-height:1.15;box-shadow:0 .8mm 0 var(--dark)}
.ribbon .nm{display:inline-block;min-width:30mm;text-align:center;border-bottom:.5mm dashed rgba(255,255,255,.85);padding:0 1mm}
.jp{margin:1.6mm 0 0 4mm;font-family:"Zen Maru Gothic",sans-serif;font-size:9pt;color:var(--dark);letter-spacing:.08em}
.bubble{position:relative;background:#fff;border:.5mm solid var(--c);border-radius:5mm;padding:2mm 3.5mm;
  font-size:10pt;line-height:1.45;color:var(--dark);max-width:56mm;text-align:center}
.bubble::after{content:"";position:absolute;right:-2.4mm;top:50%;width:3.6mm;height:3.6mm;background:#fff;
  border-right:.5mm solid var(--c);border-top:.5mm solid var(--c);transform:translateY(-50%) rotate(45deg)}
.bubble .ln{display:inline-block;min-width:36mm;border-bottom:.4mm dotted var(--dark)}

.grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:2.4mm 3mm;position:relative;z-index:1}
.slot{position:relative;background:#fff;border:.6mm dashed var(--c);border-radius:7mm}
.slot .n{position:absolute;left:-1.2mm;top:-1.2mm;width:7.4mm;height:7.4mm;border-radius:50%;
  background:var(--c);color:#fff;font-family:"Zen Maru Gothic",sans-serif;font-size:9.5pt;
  display:flex;align-items:center;justify-content:center;border:.6mm solid #fff}
.slot .deco{position:absolute;right:1.6mm;top:1.4mm;width:4.6mm;height:4.6mm;fill:var(--accent)}
.slot.goal{background:var(--goal);border:.7mm solid var(--c)}
.slot.goal .deco{width:7mm;height:7mm;right:1.2mm;top:1mm;fill:var(--c)}

@media screen and (max-width:900px){
  .preview .sheet{transform:scale(var(--fit,1));transform-origin:top left}
}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .panel{display:none}
  .layout{padding:0;display:block}
  .preview{height:auto!important}
  .sheet{box-shadow:none;transform:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="layout">

  <aside class="panel">
    <h2>集點卡設定</h2>
    <p class="sub">一張 A4 印兩張，每張 20 格</p>

    <fieldset>
      <legend>上面那張</legend>
      <label for="n1">小朋友名字</label>
      <input type="text" id="n1" maxlength="6" placeholder="例：小寶">
      <label>選一個角色</label>
      <div class="themes" data-card="1"></div>
    </fieldset>

    <fieldset>
      <legend>下面那張</legend>
      <label class="check"><input type="checkbox" id="same"> 跟上面同一位小朋友</label>
      <label for="n2">小朋友名字</label>
      <input type="text" id="n2" maxlength="6" placeholder="例：妹妹">
      <label>選一個角色</label>
      <div class="themes" data-card="2"></div>
    </fieldset>


    <button class="print" onclick="window.print()">列印</button>
    <p class="tip">列印時紙張選 A4、縮放選「100%／實際大小」，記得勾選「背景圖形」才會印出顏色。</p>
  </aside>

  <div class="preview" id="preview">
    <div class="sheet" id="sheet">
      <section class="card" id="card1"></section>
      <div class="cut"><span>✂ ─ ─ 沿虛線剪開 ─ ─</span></div>
      <section class="card" id="card2"></section>
    </div>
  </div>
</div>

<script>
const blush = `<ellipse cx="17" cy="38" rx="4.5" ry="2.6" fill="#F7A1B5" opacity=".75"/><ellipse cx="43" cy="38" rx="4.5" ry="2.6" fill="#F7A1B5" opacity=".75"/>`;
const eyes = (y=32)=>`<ellipse cx="22" cy="${y}" rx="2.3" ry="2.8" fill="#4A3530"/><ellipse cx="38" cy="${y}" rx="2.3" ry="2.8" fill="#4A3530"/><circle cx="22.8" cy="${y-1}" r=".8" fill="#fff"/><circle cx="38.8" cy="${y-1}" r=".8" fill="#fff"/>`;
const mouth = `<path d="M27 39 q1.5 2 3 0 q1.5 2 3 0" fill="none" stroke="#4A3530" stroke-width="1.3" stroke-linecap="round"/>`;
const ST = 'stroke="#4A3530" stroke-width="1.6"';

const themes = [
  {key:'bear', label:'小熊', c:'#D9A27A', bg:'#FFF6EE', dot:'#F7E3D2', dark:'#8C5A3C', accent:'#F4A9B8', goal:'#FFE9EF',
   svg:`<circle cx="12" cy="14" r="8" fill="#D9A27A" ${ST}/><circle cx="48" cy="14" r="8" fill="#D9A27A" ${ST}/><circle cx="12" cy="14" r="4" fill="#F4C9A8"/><circle cx="48" cy="14" r="4" fill="#F4C9A8"/>
        <circle cx="30" cy="33" r="22" fill="#D9A27A" ${ST}/><ellipse cx="30" cy="40" rx="9" ry="7" fill="#F8E2CC"/>${eyes(30)}<ellipse cx="30" cy="36.5" rx="2.6" ry="1.8" fill="#4A3530"/>${blush}<path d="M27.5 40.5 q2.5 2 5 0" fill="none" stroke="#4A3530" stroke-width="1.3" stroke-linecap="round"/>`},
  {key:'bunny', label:'小兔', c:'#F29BB5', bg:'#FFF2F6', dot:'#FCDDE7', dark:'#B24F72', accent:'#F6C85E', goal:'#FFF4D6',
   svg:`<ellipse cx="21" cy="14" rx="5.5" ry="13" fill="#fff" ${ST}/><ellipse cx="39" cy="14" rx="5.5" ry="13" fill="#fff" ${ST}/><ellipse cx="21" cy="15" rx="2.6" ry="9" fill="#F7B3C6"/><ellipse cx="39" cy="15" rx="2.6" ry="9" fill="#F7B3C6"/>
        <ellipse cx="30" cy="37" rx="22" ry="19" fill="#fff" ${ST}/>${eyes(35)}<path d="M28.5 39.5 l1.5 1.4 l1.5 -1.4z" fill="#F08AA6"/>${blush}`},
  {key:'cat', label:'小貓', c:'#86BFE3', bg:'#F0F8FE', dot:'#D9ECF8', dark:'#3E79A3', accent:'#F4A9B8', goal:'#FFEAF0',
   svg:`<path d="M10 24 L12 4 L26 15Z" fill="#F3EEE8" ${ST} stroke-linejoin="round"/><path d="M50 24 L48 4 L34 15Z" fill="#F3EEE8" ${ST} stroke-linejoin="round"/><path d="M13.5 18 L14 9 L21 14Z" fill="#F7B3C6"/><path d="M46.5 18 L46 9 L39 14Z" fill="#F7B3C6"/>
        <ellipse cx="30" cy="33" rx="23" ry="20" fill="#F3EEE8" ${ST}/><path d="M22 14 q8 6 16 0" fill="#9C8F86" opacity=".6"/>${eyes(31)}<path d="M28.6 35.5 l1.4 1.3 l1.4 -1.3z" fill="#F08AA6"/>${mouth}${blush}
        <path d="M6 33 l8 1 M6 38 l8 -1 M54 33 l-8 1 M54 38 l-8 -1" stroke="#4A3530" stroke-width="1" stroke-linecap="round"/>`},
  {key:'chick', label:'小雞', c:'#F2C14E', bg:'#FFFAE6', dot:'#FCEFBF', dark:'#9C7210', accent:'#F29BB5', goal:'#FFEAF0',
   svg:`<path d="M27 10 q3 -8 5 0 q4 -6 4 2" fill="#F7D35A" ${ST} stroke-linejoin="round"/>
        <ellipse cx="30" cy="34" rx="22" ry="21" fill="#F9D85F" ${ST}/>${eyes(30)}<path d="M26 35 L34 35 L30 40Z" fill="#F29A3C" stroke="#4A3530" stroke-width="1.2" stroke-linejoin="round"/>${blush}
        <path d="M9 36 q-5 4 -2 9 q3 -2 6 -3" fill="#F7D35A" ${ST} stroke-linejoin="round"/>`},
  {key:'frog', label:'青蛙', c:'#8CCB8C', bg:'#F1FAEF', dot:'#D9F0D5', dark:'#3E8648', accent:'#F6C85E', goal:'#FFF4D6',
   svg:`<circle cx="18" cy="18" r="9" fill="#9AD49A" ${ST}/><circle cx="42" cy="18" r="9" fill="#9AD49A" ${ST}/><circle cx="18" cy="18" r="5" fill="#fff"/><circle cx="42" cy="18" r="5" fill="#fff"/><circle cx="18.5" cy="18.5" r="2.8" fill="#4A3530"/><circle cx="42.5" cy="18.5" r="2.8" fill="#4A3530"/>
        <ellipse cx="30" cy="38" rx="24" ry="17" fill="#9AD49A" ${ST}/><path d="M18 18 a9 9 0 0 1 0 0" /><path d="M21 41 q9 7 18 0" fill="none" stroke="#4A3530" stroke-width="1.5" stroke-linecap="round"/>${blush}`},
  {key:'dog', label:'小狗', c:'#7FC8C0', bg:'#EFFAF8', dot:'#D4F0EC', dark:'#2F7F77', accent:'#F4A9B8', goal:'#FFEAF0',
   svg:`<circle cx="30" cy="33" r="21" fill="#F6E3C8" ${ST}/><ellipse cx="11" cy="28" rx="6.5" ry="13" fill="#C79466" ${ST} transform="rotate(18 11 28)"/><ellipse cx="49" cy="28" rx="6.5" ry="13" fill="#C79466" ${ST} transform="rotate(-18 49 28)"/>
        <ellipse cx="38" cy="30" rx="5" ry="4.5" fill="#E2BE95"/>${eyes(31)}<ellipse cx="30" cy="37" rx="3" ry="2.2" fill="#4A3530"/><path d="M27 40.5 q1.5 2 3 0 q1.5 2 3 0" fill="none" stroke="#4A3530" stroke-width="1.3" stroke-linecap="round"/><path d="M29 42.5 q1 4 2 0z" fill="#F08AA6"/>${blush}`},
  {key:'panda', label:'熊貓', c:'#A9A2C9', bg:'#F5F3FC', dot:'#E4E0F4', dark:'#5B5290', accent:'#F4A9B8', goal:'#FFEAF0',
   svg:`<circle cx="13" cy="15" r="7.5" fill="#3E3634" ${ST}/><circle cx="47" cy="15" r="7.5" fill="#3E3634" ${ST}/>
        <circle cx="30" cy="34" r="22" fill="#fff" ${ST}/><ellipse cx="21" cy="32" rx="5" ry="6.5" fill="#3E3634" transform="rotate(25 21 32)"/><ellipse cx="39" cy="32" rx="5" ry="6.5" fill="#3E3634" transform="rotate(-25 39 32)"/>
        <circle cx="21.5" cy="31.5" r="1.9" fill="#fff"/><circle cx="38.5" cy="31.5" r="1.9" fill="#fff"/><ellipse cx="30" cy="38" rx="2.6" ry="1.8" fill="#3E3634"/><path d="M27.5 41.5 q2.5 2 5 0" fill="none" stroke="#4A3530" stroke-width="1.3" stroke-linecap="round"/>${blush}`},
  {key:'pig', label:'小豬', c:'#F4A38C', bg:'#FFF3EF', dot:'#FCDCD2', dark:'#B4573C', accent:'#8CC9E8', goal:'#EAF6FD',
   svg:`<path d="M10 22 L12 8 L23 15Z" fill="#F9C6C2" ${ST} stroke-linejoin="round"/><path d="M50 22 L48 8 L37 15Z" fill="#F9C6C2" ${ST} stroke-linejoin="round"/>
        <ellipse cx="30" cy="34" rx="23" ry="20" fill="#F9C6C2" ${ST}/>${eyes(29)}<ellipse cx="30" cy="38" rx="7" ry="5" fill="#F4A3A6" ${ST}/><ellipse cx="27.5" cy="38" rx="1.3" ry="1.9" fill="#4A3530"/><ellipse cx="32.5" cy="38" rx="1.3" ry="1.9" fill="#4A3530"/>
        <ellipse cx="14" cy="39" rx="4" ry="2.4" fill="#F28C9E" opacity=".7"/><ellipse cx="46" cy="39" rx="4" ry="2.4" fill="#F28C9E" opacity=".7"/>`},
  {key:'penguin', label:'企鵝', c:'#6E9BD1', bg:'#F0F5FC', dot:'#D8E5F6', dark:'#2F5C97', accent:'#F6C85E', goal:'#FFF4D6',
   svg:`<ellipse cx="30" cy="33" rx="23" ry="22" fill="#3D4F6E" ${ST}/><path d="M30 18 C18 14 11 26 13 37 C15 48 24 52 30 52 C36 52 45 48 47 37 C49 26 42 14 30 18Z" fill="#fff"/>
        ${eyes(33)}<path d="M26 38 L34 38 L30 42.5Z" fill="#F6B13C" stroke="#4A3530" stroke-width="1.2" stroke-linejoin="round"/>${blush}`},
  {key:'koala', label:'無尾熊', c:'#9DB4B8', bg:'#F2F7F8', dot:'#DCE8EA', dark:'#4D6A70', accent:'#F4A9B8', goal:'#FFEAF0',
   svg:`<circle cx="10" cy="22" r="10" fill="#B9C3C6" ${ST}/><circle cx="50" cy="22" r="10" fill="#B9C3C6" ${ST}/><circle cx="10" cy="22" r="5.5" fill="#F3E9EC"/><circle cx="50" cy="22" r="5.5" fill="#F3E9EC"/>
        <ellipse cx="30" cy="35" rx="20" ry="19" fill="#B9C3C6" ${ST}/>${eyes(31)}<ellipse cx="30" cy="38" rx="4.5" ry="5.5" fill="#4A4245"/>${blush}`},
  {key:'fox', label:'狐狸', c:'#F2A65A', bg:'#FFF6EC', dot:'#FCE3C6', dark:'#A55E17', accent:'#8CC9E8', goal:'#EAF6FD',
   svg:`<path d="M9 26 L12 4 L27 16Z" fill="#F4A259" ${ST} stroke-linejoin="round"/><path d="M51 26 L48 4 L33 16Z" fill="#F4A259" ${ST} stroke-linejoin="round"/><path d="M13 18 L14 9 L21 15Z" fill="#4A3530"/><path d="M47 18 L46 9 L39 15Z" fill="#4A3530"/>
        <path d="M8 30 C8 18 18 13 30 13 C42 13 52 18 52 30 C52 42 40 52 30 53 C20 52 8 42 8 30Z" fill="#F4A259" ${ST}/><path d="M10 33 C16 34 24 38 30 53 C36 38 44 34 50 33 C48 45 38 53 30 53 C22 53 12 45 10 33Z" fill="#fff"/>
        ${eyes(31)}<ellipse cx="30" cy="44" rx="2.4" ry="1.8" fill="#4A3530"/>${blush}`}
];
const icons = {
  heart:'<path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/>',
  star:'<path d="M12 2.5l2.8 6.2 6.7.6-5 4.5 1.5 6.6L12 17l-6 3.4 1.5-6.6-5-4.5 6.7-.6z"/>',
  crown:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-1.8 11H4.8z"/>'
};
const state = {1:0, 2:2};
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

function renderCard(i){
  const t = themes[state[i]];
  const card = $('card'+i);
  for(const k of ['c','bg','dot','dark','accent','goal']) card.style.setProperty('--'+k, t[k]);
  const name = $('n'+(i===2 && $('same').checked ? 1 : i)).value.trim();
  let slots = '';
  for(let k=1;k<=20;k++){
    if(k===20) slots += `<div class="slot goal"><span class="n">${k}</span><svg class="deco" viewBox="0 0 24 24">${icons.crown}</svg></div>`;
    else if(k%5===0) slots += `<div class="slot"><span class="n">${k}</span><svg class="deco" viewBox="0 0 24 24">${k===10?icons.star:icons.heart}</svg></div>`;
    else slots += `<div class="slot"><span class="n">${k}</span></div>`;
  }
  card.innerHTML = `
    <div class="head">
      <div class="titlebox">
        <div class="ribbon"><span class="nm">${name ? esc(name) : '&nbsp;'}</span><span>的集點卡</span></div>
      </div>
      <svg class="mascot" viewBox="0 0 60 60">${t.svg}</svg>
    </div>
    <div class="grid">${slots}</div>`;
}
function renderAll(){
  $('n2').disabled = $('same').checked;
  renderCard(1); renderCard(2);
}

document.querySelectorAll('.themes').forEach(box=>{
  const i = +box.dataset.card;
  themes.forEach((t,idx)=>{
    const b = document.createElement('button');
    b.type='button';
    b.style.setProperty('--t-bg',t.bg); b.style.setProperty('--t-c',t.c);
    b.setAttribute('aria-pressed', idx===state[i]);
    b.innerHTML = `<svg viewBox="0 0 60 60">${t.svg}</svg>${t.label}`;
    b.onclick=()=>{
      state[i]=idx;
      box.querySelectorAll('button').forEach((x,j)=>x.setAttribute('aria-pressed', j===idx));
      renderCard(i);
    };
    box.appendChild(b);
  });
});
['n1','n2'].forEach(id=>$(id).addEventListener('input',renderAll));
$('same').addEventListener('change',renderAll);

function fit(){
  const pv = $('preview'), sh = $('sheet');
  const small = window.innerWidth <= 900;
  const s = small ? Math.min(1, (window.innerWidth - 48) / sh.offsetWidth) : 1;
  sh.style.setProperty('--fit', s);
  pv.style.height = small ? sh.offsetHeight*s+'px' : '';
}
window.addEventListener('resize',fit);
renderAll(); fit();
</script>
</body>
</html>
